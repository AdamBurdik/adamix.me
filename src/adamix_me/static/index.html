<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>adamix.me</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="now-playing" id="now-playing" aria-live="polite">
      <div class="status" id="status">Listening to</div>
      <div class="body">
        <div class="cover-wrap">
          <img class="cover" id="cover" alt="Album cover" />
          <img class="avatar" id="avatar" alt="Artist" />
        </div>
        <div class="meta">
          <div class="title" id="title">—</div>
          <div class="artist" id="artist">—</div>
          <div class="album" id="album">—</div>
        </div>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
